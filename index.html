<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STANDOFF 2 - FPS POV</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #viewport { width: 100%; height: 100%; background: url('https://wallpapercave.com/wp/wp6889758.jpg') center/cover; position: relative; }
        #vignette { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.7) 100%); pointer-events: none; z-index: 5; }
        #gun { position: fixed; bottom: -60px; right: -40px; width: 650px; z-index: 10; transform: rotate(-5deg); transition: 0.05s; pointer-events: none; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid #0f0; border-radius: 50%; z-index: 20; pointer-events: none; }
        .hud { position: absolute; bottom: 20px; color: white; font-family: sans-serif; font-weight: bold; font-size: 30px; z-index: 30; text-shadow: 2px 2px #000; }
    </style>
</head>
<body onclick="fire()">
    <div id="vignette"></div>
    <div id="viewport">
        <div style="left: 30px;" class="hud">+ 100</div>
        <div style="right: 40px;" class="hud">30 / 90</div>
        <div id="crosshair"></div>
        <img id="gun" src="https://www.pngmart.com/files/13/Assault-Rifle-PNG-Transparent-Image.png">
    </div>
    <script>
        function fire() {
            const gun = document.getElementById('gun');
            gun.style.transform = 'translateY(-20px) rotate(-7deg) scale(1.1)';
            setTimeout(() => { gun.style.transform = 'rotate(-5deg)'; }, 60);
        }
    </script>
</body>
</html>
